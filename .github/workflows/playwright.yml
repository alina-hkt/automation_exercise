name: Playwright Tests with Allure inside Docker

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Собираем Docker-образ (используя тот оптимизированный Dockerfile от Microsoft)
      - name: Build Docker Image
        run: docker build -t automation-tests .

      # 2. Безопасно запускаем тесты внутри Docker-контейнера
      # Секреты прокидываются через флаг --env напрямую в память процесса, никаких файлов .env!
      # Папка allure-results мапится наружу (-v), чтобы GitHub Actions мог забрать результаты для отчета.
      - name: Run Pytest inside Docker
        run: |
          docker run \
            --env BASE_URL="https://automationexercise.com" \
            --env TEST_USER_EMAIL="${{ secrets.TEST_USER_EMAIL }}" \
            --env TEST_USER_PASSWORD="${{ secrets.TEST_USER_PASSWORD }}" \
            --env NAME="${{ secrets.NAME }}" \
            -v $(pwd)/allure-results:/app/allure-results \
            automation-tests
        continue-on-error: true

      - name: Load Allure history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Generate Allure Report (Java CLI)
        if: always()
        run: |
          wget -q https://apache.org
          unzip -q allure-commandline-2.29.0.zip -d /tmp/allure
          
          /tmp/allure/allure-2.29.0/bin/allure generate allure-results -o allure-history --clean
          
          touch allure-history/.nojekyll
          
      - name: Deploy report to Github Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_BRANCH: gh-pages
          PUBLISH_DIR: allure-history