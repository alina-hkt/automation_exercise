name: Playwright Tests with Allure (Docker)
on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t playwright-tests .

      - name: Prepare Allure results directory
        run: |
          rm -rf allure-results
          mkdir -p allure-results
          chmod 777 allure-results

      - name: Run tests in container
        env:
          BASE_URL: https://www.automationexercise.com
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          NAME: ${{ secrets.NAME }}
        run: |
          docker run --rm \
            -e BASE_URL \
            -e TEST_USER_EMAIL \
            -e TEST_USER_PASSWORD \
            -e NAME \
            -v ${{ github.workspace }}/allure-results:/app/allure-results \
            playwright-tests

      - name: Load Allure history
        if: always()
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
          persist-credentials: false

      - name: Copy Allure history to results
        if: always()
        run: |
          if [ -d "gh-pages/history" ]; then
            cp -r gh-pages/history allure-results/
          fi

      - name: Generate Allure Report
        if: always()
        run: |
          wget -q https://repo.maven.apache.org/maven2/io/qameta/allure/allure-commandline/2.29.0/allure-commandline-2.29.0.zip
          unzip -q allure-commandline-2.29.0.zip -d /tmp/allure
          /tmp/allure/allure-2.29.0/bin/allure generate allure-results -o allure-history --clean
          touch allure-history/.nojekyll

      - name: Deploy to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history