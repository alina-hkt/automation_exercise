name: Playwright Tests with Allure

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update apt lists
        run: sudo apt-get update

      - name: Install Playwright Browsers
        run: playwright install --with-deps chromium

      - name: Create .env from secrets
        run: |
          echo "BASE_URL=https://www.automationexercise.com" > .env
          echo "TEST_USER_EMAIL=${{secrets.TEST_USER_EMAIL}}" >> .env
          echo "TEST_USER_PASSWORD=${{secrets.TEST_USER_PASSWORD}}" >> .env
          echo "NAME=${{secrets.NAME}}" >> .env
          
      - name: Run Pytest
        run: pytest UI_TESTS/ --alluredir=allure-results --clean-alluredir -v
        continue-on-error: true

      - name: Load Allure history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Generate Allure Report
        if: always()
        uses: simple-elf/allure-report-action@v1.8 
        with:
          allure_results: allure-results
          allure_history: allure-history
          keep_reports: 100
          gh_pages: gh-pages
          
      - name: Deploy report to Github Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_BRANCH: gh-pages
          PUBLISH_DIR: allure-history